version: "3.8"

services:
  db:
    container_name: creditos-db
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: creditosdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts SQL de inicialização
      - ./api-creditos/src/main/resources/db/migration:/docker-entrypoint-initdb.d

  api:
    container_name: creditos-api
    build:
      context: ./api-creditos
    restart: always
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/creditosdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

  frontend:
    container_name: creditos-front
    build:
      context: ./consulta-credito-front
    ports:
      - "4200:80"  
    depends_on:
      - api

volumes:
  postgres_data:
